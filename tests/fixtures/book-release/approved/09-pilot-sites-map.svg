<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">Места главы: координатная схема</title>
  <desc id="desc">Авторская схема примерных координат Хотана, Лянчжу, Юнчэна, Маньчэна и Гуанчжоу. Линии маршрута нет; Хотан отмечен как вопрос для перехода к истории сырья, а не как доказанный торговый путь. Схема не картографически точна.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0df"/><stop offset="1" stop-color="#e5d8bd"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe8dc"/><stop offset="1" stop-color="#c5d8cc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173d38" flood-opacity=".18"/></filter>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="1" fill="#314b43" fill-opacity=".06"/><path d="M0 25H32" stroke="#314b43" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1800" height="1125" fill="url(#paper)"/>
  <rect width="1800" height="1125" fill="url(#grain)"/>
  <path d="M80 85H1720" stroke="#9d7437" stroke-width="3"/>
  <text x="105" y="160" fill="#153c36" font-family="Georgia, 'Noto Serif', serif" font-size="61" font-weight="700">Места главы</text>
  <text x="108" y="208" fill="#716553" font-family="Arial, 'Noto Sans', sans-serif" font-size="23" letter-spacing="2.4">КООРДИНАТНАЯ СХЕМА · БЕЗ ЗАЕМНОЙ КАРТОГРАФИИ</text>

  <g filter="url(#shadow)">
    <rect x="105" y="260" width="1590" height="685" rx="30" fill="url(#sea)" stroke="#55796d" stroke-width="3"/>
  </g>
  <!-- Approximate longitude/latitude grid: x 70–125 E; y 20–45 N. -->
  <g stroke="#3f6d61" stroke-opacity=".22" stroke-width="2">
    <path d="M295 295V885M540 295V885M785 295V885M1030 295V885M1275 295V885M1520 295V885"/>
    <path d="M180 768H1620M180 650H1620M180 532H1620M180 414H1620"/>
  </g>
  <g fill="#344d45" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">
    <text x="277" y="918">75° E</text><text x="521" y="918">85°</text><text x="766" y="918">95°</text><text x="1004" y="918">105°</text><text x="1249" y="918">115°</text><text x="1494" y="918">125°</text>
    <text x="132" y="774">25° N</text><text x="132" y="656">30°</text><text x="132" y="538">35°</text><text x="132" y="420">40°</text>
  </g>

  <!-- Hotan, approx. 37.1 N, 79.9 E -->
  <g transform="translate(415 484)">
    <circle r="35" fill="none" stroke="#a64236" stroke-width="4" stroke-dasharray="8 8"/>
    <circle r="8" fill="#a64236"/>
    <path d="M34-22L88-65" stroke="#a64236" stroke-width="2"/>
    <rect x="82" y="-112" width="330" height="83" rx="15" fill="#f3ead8" stroke="#a64236" stroke-width="2"/>
    <text x="105" y="-78" fill="#6a2f2b" font-family="Georgia, 'Noto Serif', serif" font-size="27" font-weight="700">Хотан · 和田</text>
    <text x="105" y="-48" fill="#6a4d43" font-family="Arial, 'Noto Sans', sans-serif" font-size="19">переход к истории сырья?</text>
  </g>

  <!-- Mancheng, approx. 39.0 N, 115.3 E -->
  <g transform="translate(1284 438)"><circle r="12" fill="#a47632"/><circle r="24" fill="none" stroke="#a47632" stroke-opacity=".35" stroke-width="3"/><text x="34" y="-4" fill="#24483f" font-family="Georgia, 'Noto Serif', serif" font-size="27" font-weight="700">Маньчэн · 满城</text><text x="34" y="25" fill="#3f5049" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">ханьские погребения</text></g>
  <!-- Yongcheng, approx. 33.9 N, 116.4 E -->
  <g transform="translate(1311 558)"><circle r="13" fill="#a64236"/><circle r="25" fill="none" stroke="#a64236" stroke-opacity=".32" stroke-width="3"/><text x="35" y="-4" fill="#24483f" font-family="Georgia, 'Noto Serif', serif" font-size="27" font-weight="700">Юнчэн · 永城</text><text x="35" y="25" fill="#3f5049" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">гробница Сишань</text></g>
  <!-- Liangzhu, approx. 30.4 N, 120.0 E -->
  <g transform="translate(1399 642)"><circle r="12" fill="#2f6c5e"/><circle r="24" fill="none" stroke="#2f6c5e" stroke-opacity=".35" stroke-width="3"/><text x="34" y="-4" fill="#24483f" font-family="Georgia, 'Noto Serif', serif" font-size="27" font-weight="700">Лянчжу · 良渚</text><text x="34" y="25" fill="#3f5049" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">глубокая древность</text></g>
  <!-- Guangzhou, approx. 23.1 N, 113.3 E -->
  <g transform="translate(1235 813)"><circle r="12" fill="#6d8768"/><circle r="24" fill="none" stroke="#6d8768" stroke-opacity=".35" stroke-width="3"/><text x="34" y="-4" fill="#24483f" font-family="Georgia, 'Noto Serif', serif" font-size="27" font-weight="700">Гуанчжоу · 广州</text><text x="34" y="25" fill="#3f5049" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">гробница Наньюэ</text></g>

  <g font-family="Arial, 'Noto Sans', sans-serif">
    <rect x="105" y="982" width="1590" height="78" rx="18" fill="#173f39"/>
    <circle cx="151" cy="1021" r="15" fill="none" stroke="#e0ba6f" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="185" y="1015" fill="#f5eedf" font-size="20">Точки — примерные координаты; линий маршрута нет.</text>
    <text x="185" y="1044" fill="#cbd9d2" font-size="20">Хотан — вопрос для следующего раздела, а не утверждение о доказанном торговом пути.</text>
  </g>
  <text x="1695" y="1094" text-anchor="end" fill="#4f422f" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">Не картографически точно · Авторская схема · CC BY 4.0</text>
</svg>
